<style>
:root{
  --marfil:#F5EFE5; --papel:#FBF8F2; --bosque:#283C32; --bosque-suave:#56685B;
  --tenue:#8C9286; --verde:#45604D; --orquidea:#9C6A84; --oro:#B08543; --error:#9A3F3F;
  --display:"Cormorant Garamond", Georgia, serif; --cuerpo:"EB Garamond", Georgia, serif;
}
*{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
body{
  background:
    radial-gradient(95% 55% at 12% -4%, rgba(255,247,222,.95), transparent 62%),
    radial-gradient(70% 45% at 105% 102%, rgba(69,96,77,.13), transparent 68%),
    var(--marfil);
  color:var(--bosque); font-family:var(--cuerpo); font-size:17.5px; line-height:1.6;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  display:flex; align-items:center; justify-content:center;
  padding: calc(env(safe-area-inset-top,0px) + 24px) clamp(20px,7vw,32px) calc(env(safe-area-inset-bottom,0px) + 24px);
}
[hidden]{ display:none !important; }
.puerta{ width:100%; max-width:22rem; text-align:center; display:flex; flex-direction:column; align-items:center; gap:1rem; }
.flor{ width:84px; height:84px; margin-bottom:.4rem; animation: respira 5s ease-in-out infinite; }
@keyframes respira{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.04); } }
.eyebrow{ font-family:var(--display); font-weight:600; font-size:.72rem; letter-spacing:.32em; text-transform:uppercase; color:var(--oro); margin:0; }
h1{ font-family:var(--display); font-style:italic; font-weight:400; font-size:clamp(1.9rem,8.6vw,2.4rem); line-height:1.1; margin:0; text-wrap:balance; }
.guia{ font-family:var(--display); font-style:italic; font-size:1.1rem; color:var(--bosque-suave); margin:0; }
form{ width:100%; display:flex; flex-direction:column; gap:.8rem; margin-top:.6rem; }
label{ font-family:var(--display); font-weight:600; font-size:.7rem; letter-spacing:.22em; text-transform:uppercase; color:var(--tenue); text-align:left; }
input{
  width:100%; font:inherit; font-size:1.05rem; color:var(--bosque);
  background:var(--papel); border:1px solid rgba(69,96,77,.32); border-radius:14px;
  padding:.85rem 1rem; min-height:52px; outline:none;
  transition:border-color .25s ease, box-shadow .25s ease;
}
input:focus{ border-color:var(--verde); box-shadow:0 0 0 3px rgba(69,96,77,.15); }
input[aria-invalid="true"]{ border-color:var(--error); }
button{
  appearance:none; border:0; cursor:pointer; min-height:50px; border-radius:999px;
  background:var(--verde); color:var(--marfil);
  font-family:var(--display); font-weight:600; font-size:.82rem; letter-spacing:.22em; text-transform:uppercase;
}
button:disabled{ opacity:.6; cursor:default; }
button:focus-visible{ outline:2px solid var(--orquidea); outline-offset:3px; }
.mensaje{ font-family:var(--display); font-style:italic; font-size:1.02rem; min-height:1.5em; margin:0; color:var(--bosque-suave); }
.mensaje.error{ color:var(--error); }
@media (prefers-reduced-motion: reduce){ .flor{ animation:none; } }
</style>
</head>

  </svg>
  <p class="eyebrow">Un jardín privado</p>
  <h1>Este jardín florece para una sola persona</h1>
  <p class="guia" id="guia">Escribe tu correo para entrar.</p>
  <form id="formulario" novalidate>
    <label for="correo">Tu correo electrónico</label>
    <input id="correo" name="correo" type="email" inputmode="email" autocomplete="email"
           autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <button type="submit" id="boton">Entrar</button>
  </form>
  <p class="mensaje" id="mensaje" role="status" aria-live="polite"></p>
</main>

const RECUERDO = "jardin.puerta";

const normalizar = c => {
  c = (c || "").trim().toLowerCase().replace(/\s+/g, "");
  const i = c.indexOf("@");
  if (i < 0) return c;
  let local = c.slice(0, i), dominio = c.slice(i + 1);
  if (dominio === "gmail.com" || dominio === "googlemail.com"){
    local = local.split("+")[0].replace(/\./g, ""); dominio = "gmail.com";
  }
  return local + "@" + dominio;
};
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function llave(correo){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(normalizar(correo)), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: bytes(COFRE.sal), iterations: COFRE.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}

async function abrir(correo){
  const k = await llave(correo);
  /* si el correo no es el correcto, esto falla y no se revela nada */
  const plano = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(COFRE.iv) }, k, bytes(COFRE.ct));
  let html = new TextDecoder().decode(plano);

  /* fotos y audios cifrados: se descifran en memoria y se sirven como blobs */
  await Promise.all((COFRE.activos || []).map(async ([ruta, archivo, tipo]) => {
    try {
      const r = await fetch(archivo, { cache: "force-cache" });
      if (!r.ok) return;
      const buf = new Uint8Array(await r.arrayBuffer());
      const datos = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, k, buf.slice(12));
      const url = URL.createObjectURL(new Blob([datos], { type: tipo }));
      html = html.split(ruta).join(url);
    } catch(_){}
  }));

  try { localStorage.setItem(RECUERDO, normalizar(correo)); } catch(_){}
  document.open(); document.write(html); document.close();
}

const form = document.getElementById("formulario");
const input = document.getElementById("correo");
const boton = document.getElementById("boton");
const msg = document.getElementById("mensaje");

function estado(texto, error){
  msg.textContent = texto || "";
  msg.classList.toggle("error", !!error);
  input.setAttribute("aria-invalid", error ? "true" : "false");
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  const correo = input.value;
  if (!correo.includes("@")){ estado("Escribe el correo completo, con la @.", true); input.focus(); return; }
  boton.disabled = true; estado("Abriendo el jardín…");
  try { await abrir(correo); }
  catch(_){
    boton.disabled = false;
    estado("Ese correo no abre este jardín. Revísalo letra por letra.", true);
    input.select();
  }
});

/* si este teléfono ya entró antes, abre solo */
(async () => {
  if (!window.crypto || !crypto.subtle){
    estado("Abre este enlace con https:// en Chrome o Samsung Internet.", true);
    form.hidden = true; return;
  }
  let guardado = null;
  try { guardado = localStorage.getItem(RECUERDO); } catch(_){}
  if (guardado){
    form.hidden = true; document.getElementById("guia").hidden = true; estado("Abriendo el jardín…");
    try { await abrir(guardado); return; }
    catch(_){ try { localStorage.removeItem(RECUERDO); } catch(_){} form.hidden = false; document.getElementById("guia").hidden = false; estado(""); }
  }
})();
